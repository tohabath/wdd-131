<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
    <link rel="stylesheet" href="recipes.css">
    <script src="main.js"></script>
    <meta charset="UTF-8" />
    <meta lang="en">

    <meta property="og:title" content="Page Title">
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Page Description">
    <meta property="og:image" content="URL to an image">
    <meta property="og:url" content="URL of the page">
    <meta name="twitter:card" content="summary_large_image">

  </head>
  <section class="website-title-container">
    <a href="" class="website-title-link">
        <h1 class="website-title">
            Recipe Book
        </h1>
    </a>
  </section>
  <main>
    <section class="search-container">
        <form class="search">
            <label for="searchBar" class="search-label">Search</label>
            <input class="search-bar" id="searchBar">
            <label for="searchButton" class="search-label">Search Button</label>
            <button class="search-button" id="searchButton">
                <span class="material-symbols-outlined">
                    search
                </span>
            </button>
        </form>
    </section>
    <hr>
    <section class="recipes-container">
        <article class="recipe">
            <div class="recipe-image-container">
                <img class="recipe-image" src='./images/sweet-potato-waffle-md.jpg' alt="sweet potato waffles">
            </div>
            <div class="recipe-content">
                <div class="tags">
                    <a href="" class="tag-item">
                        Waffles
                    </a>
                    <a href=""  class="tag-item">
                        Sweet Potato
                    </a>
                    <a href=""  class="tag-item">
                        Side
                    </a>
                </div>
                <header class="name">
                    Sweet Potato Waffles
                </header>
                <span
                    class="rating"
                    role="img"
                    aria-label="Rating: 4 out of 5 stars"
                >
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>
                <p class="description">
                    Savory waffles made with Sweet potato with a hint of Ginger
                </p>
            </div>
        </article>
    </section>
  </main>
  <footer>
    <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
    </div>
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
  </footer>
</html>
